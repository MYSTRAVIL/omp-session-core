# Every push to main runs the release gates. A v* tag runs them too and then publishes the tarball
# they tested to npm through trusted publishing (OIDC), so no npm token is stored anywhere.
# npm's trusted publisher for @mystravil/omp-session-core names this file: renaming it breaks publishing.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, with the release tag at that commit in the comment: a moved tag
      # cannot change what runs here or in the job that publishes. Update by hand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(bun -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run test
      # Builds, packs into pack/, and proves the tarball in a throwaway app.
      - run: bun run consumer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pack/*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; pin the release npm instead of the runner's.
      - run: npm install -g npm@11.21.2
      # 0.1.0 was published by hand, because npm sets up a trusted publisher only for a package that
      # exists. Its tag, and any re-run of a published tag, ends here instead of failing the publish.
      - name: Skip a version already on npm
        id: published
        run: |
          if npm view "@mystravil/omp-session-core@${GITHUB_REF_NAME#v}" version 2>/dev/null | grep -q .; then
            echo "${GITHUB_REF_NAME} is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.published.outputs.skip != 'true'
        with:
          name: package
      # The ./ prefix keeps npm from reading the path as a GitHub shorthand.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish ./*.tgz --access public
